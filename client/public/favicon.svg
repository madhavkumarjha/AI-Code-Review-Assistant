<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#334155" stroke-width="4" stroke-opacity="0.5" fill="none"/>

  <!-- Glowing outer shield -->
  <path d="M256 64 C360 64, 416 112, 416 192 C416 320, 320 400, 256 448 C192 400, 96 320, 96 192 C96 112, 152 64, 256 64 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Inner shield dark layer -->
  <path d="M256 88 C340 88, 388 128, 388 196 C388 304, 308 376, 256 418 C204 376, 124 304, 124 196 C124 128, 172 88, 256 88 Z" 
        fill="#090d16" fill-opacity="0.9"/>

  <!-- Code brackets </> and neural spark -->
  <!-- Left bracket < -->
  <path d="M210 180 L150 256 L210 332" stroke="#22d3ee" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right bracket > -->
  <path d="M302 180 L362 256 L302 332" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central slash / or checkmark -->
  <path d="M272 170 L240 342" stroke="#a855f7" stroke-width="20" stroke-linecap="round"/>

  <!-- AI Neural Spark Star -->
  <g transform="translate(256, 140)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8"/>
    <path d="M0 -32 L0 32 M-32 0 L32 0" stroke="#67e8f9" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
